name: Build configuration

on:
  workflow_call:
    inputs:
      name:
        description: Human-readable configuration name
        required: true
        type: string
      os:
        description: Runner label
        required: true
        type: string
      attr:
        description: Flake output attribute to build
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    name: ${{ inputs.name }}
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-nix
      - name: Build ${{ inputs.name }}
        run: nix build --print-build-logs --out-link result ".#${{ inputs.attr }}"
      - name: Compute output digest
        id: digest
        run: |
          out=$(readlink -f result)
          nar=$(nix path-info --json --json-format 1 "$out" | jq -r '.[].narHash')
          echo "path=$out" >> "$GITHUB_OUTPUT"
          echo "sha256=$(nix hash convert --hash-algo sha256 --to base16 "$nar")" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1.4.4
        with:
          subject-name: ${{ steps.digest.outputs.path }}
          subject-digest: sha256:${{ steps.digest.outputs.sha256 }}
