name: Pages

on:
  push:
    branches: [main, master]
    paths:
      - scripts/install-macos.sh
      - docs/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Lint installer
        run: shellcheck scripts/install-macos.sh
      - uses: actions/configure-pages@v6.0.0
        id: pages
      - uses: ruby/setup-ruby@v1.335.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: docs
      - name: Build site
        working-directory: docs
        run: |
          { printf -- '---\nlayout: default\ntitle: nixos-config\n---\n'; cat README.md; } > index.md
          sed "s|@FLAKEHUB_FLAKE@|${{ github.repository }}|" \
            ../scripts/install-macos.sh > install.sh
          bundle exec jekyll build --destination ../_site --baseurl "${{ steps.pages.outputs.base_path }}"
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
