name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-flakes:
    name: Check flakes
    uses: ./.github/workflows/flake-checker.yml

  nixos:
    uses: ./.github/workflows/build-config.yml
    name: Build NixOS configuration
    with:
      name: nixos nodebook
      os: ubuntu-latest
      attr: nixosConfigurations.nodebook.config.system.build.toplevel

  darwin:
    uses: ./.github/workflows/build-config.yml
    name: Build Nix-darwin configuration
    with:
      name: darwin macbook
      os: macos-latest
      attr: darwinConfigurations.macbook.system
