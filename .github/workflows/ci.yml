name: CI

on:
  push:
    branches:
      - main
      - release/*.*.x
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-flakes:
    name: Check flakes
    uses: ./.github/workflows/flake-checker.yml

  nixos:
    uses: ./.github/workflows/build-config.yml
    name: Build NixOS configuration
    needs: [ check-flakes ]
    with:
      name: nixos linux
      os: ubuntu-latest
      attr: nixosConfigurations.linux.config.system.build.toplevel

  darwin:
    uses: ./.github/workflows/build-config.yml
    name: Build Nix-darwin configuration
    needs: [ check-flakes ]
    with:
      name: darwin darwin
      os: macos-latest
      attr: darwinConfigurations.darwin.system
