name: Setup Nix
description: Install Nix with Determinate Systems (the repository must already be checked out)

runs:
  using: composite
  steps:
    - uses: DeterminateSystems/determinate-nix-action@main
    - uses: DeterminateSystems/magic-nix-cache-action@main
    - name: Show Nix version
      shell: bash
      run: nix --version
